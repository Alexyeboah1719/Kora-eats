<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email | KORA EATS</title>
  <meta name="theme-color" content="#0F2E22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/auth.css" rel="stylesheet">
</head>
<body>
<div class="auth-layout">
  <aside class="auth-aside">
    <a class="brand fs-4 text-white text-decoration-none" href="/"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i> KORA EATS</a>
    <div>
      <h2>Good food, from vendors you trust.</h2>
      <ul class="mt-4">
        <li><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> Vendors near you</li>
        <li><i class="bi bi-phone-fill" aria-hidden="true"></i> Pay with Mobile Money</li>
        <li><i class="bi bi-bicycle" aria-hidden="true"></i> Track your delivery live</li>
      </ul>
    </div>
    <span class="small" style="color:#9fb3a8">&copy; KORA EATS</span>
  </aside>
  <main class="auth-main" id="main">
    <div class="auth-card">
      <div class="auth-mobile-brand"><a class="brand fs-4 text-decoration-none" href="/"><i class="bi bi-bag-heart-fill text-warning" aria-hidden="true"></i> KORA EATS</a></div>
      <a class="back-home small text-decoration-none link-ink d-inline-block mb-3" href="/"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>
      <h1>Check your email</h1>
      <p class="sub">We sent a 6-digit code to <strong id="email-label"></strong>. It expires in 10 minutes.</p>
      <div id="form-alert" class="alert d-none" role="alert"></div>
      <form id="otp-form" novalidate>
        <div class="otp-row" role="group" aria-label="6-digit verification code">
          <input class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1">
          <input class="otp-input" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Digit 2">
          <input class="otp-input" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Digit 3">
          <input class="otp-input" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Digit 4">
          <input class="otp-input" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Digit 5">
          <input class="otp-input" inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Digit 6">
        </div>
        <button id="submit-btn" class="btn-primary-ink" type="submit">Verify email</button>
      </form>
      <div class="text-center mt-4">
        <button id="resend-btn" class="btn btn-link link-ink p-0" type="button" disabled>Resend code</button>
        <div class="mt-2"><a class="small text-muted-ink" href="/auth/register.html">Wrong email? Start over</a></div>
      </div>
    </div>
  </main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/verify-otp.js"></script>
</body>
</html>
