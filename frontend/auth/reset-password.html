<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | KORA EATS</title>
  <meta name="theme-color" content="#0F2E22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/auth.css" rel="stylesheet">
</head>
<body>
<div class="auth-layout">
  <aside class="auth-aside">
    <a class="brand fs-4 text-white text-decoration-none" href="/"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i> KORA EATS</a>
    <div>
      <h2>Good food, from vendors you trust.</h2>
      <ul class="mt-4">
        <li><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> Vendors near you</li>
        <li><i class="bi bi-phone-fill" aria-hidden="true"></i> Pay with Mobile Money</li>
        <li><i class="bi bi-bicycle" aria-hidden="true"></i> Track your delivery live</li>
      </ul>
    </div>
    <span class="small" style="color:#9fb3a8">&copy; KORA EATS</span>
  </aside>
  <main class="auth-main" id="main">
    <div class="auth-card">
      <div class="auth-mobile-brand"><a class="brand fs-4 text-decoration-none" href="/"><i class="bi bi-bag-heart-fill text-warning" aria-hidden="true"></i> KORA EATS</a></div>
      <a class="back-home small text-decoration-none link-ink d-inline-block mb-3" href="/"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to home</a>
      <h1>Set a new password</h1>
      <p class="sub">Choose a strong password you haven't used before.</p>
      <div id="form-alert" class="alert d-none" role="alert"></div>
      <form id="reset-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <div class="pw-wrap">
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
            <button class="pw-toggle" type="button" data-toggle-password="#password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div><div class="hint mt-1">At least 8 characters, with a letter and a number.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Confirm new password</label>
          <div class="pw-wrap">
            <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
            <button class="pw-toggle" type="button" data-toggle-password="#confirm_password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button id="submit-btn" class="btn-primary-ink" type="submit">Update password</button>
      </form>
      <p class="text-center mt-4 mb-0"><a class="link-ink" href="/auth/login.html">Back to login</a></p>
    </div>
  </main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
