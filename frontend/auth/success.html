<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're in | KORA EATS</title>
  <meta name="theme-color" content="#0F2E22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/auth.css" rel="stylesheet">
</head>
<body>
<div class="auth-layout">
  <aside class="auth-aside">
    <a class="brand fs-4 text-white text-decoration-none" href="/"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i> KORA EATS</a>
    <div>
      <h2>Good food, from vendors you trust.</h2>
      <ul class="mt-4">
        <li><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> Vendors near you</li>
        <li><i class="bi bi-phone-fill" aria-hidden="true"></i> Pay with Mobile Money</li>
        <li><i class="bi bi-bicycle" aria-hidden="true"></i> Track your delivery live</li>
      </ul>
    </div>
    <span class="small" style="color:#9fb3a8">&copy; KORA EATS</span>
  </aside>
  <main class="auth-main" id="main">
    <div class="auth-card">
      <div class="auth-mobile-brand"><a class="brand fs-4 text-decoration-none" href="/"><i class="bi bi-bag-heart-fill text-warning" aria-hidden="true"></i> KORA EATS</a></div>
      <div id="loading" class="text-center py-5" role="status"><span class="spinner-border" aria-hidden="true"></span><span class="visually-hidden">Loading</span></div>
      <div id="content" class="d-none">
        <div class="success-badge"><i class="bi bi-check-lg" aria-hidden="true"></i></div>
        <h1>You're in, <span id="user-name"></span>!</h1>
        <p class="sub">Your account is verified and secure.</p>
        <div class="user-box">
          <div class="d-flex justify-content-between align-items-center">
            <span id="user-email" class="text-break"></span>
            <span id="user-role" class="role-pill"></span>
          </div>
        </div>
        <a id="continue-btn" class="btn-primary-ink d-block text-center text-decoration-none mb-2" href="/">Continue</a>
        <button id="logout-btn" class="btn-outline-ink" type="button"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Log out</button>
      </div>
    </div>
  </main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex"><div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/success.js"></script>
</body>
</html>
