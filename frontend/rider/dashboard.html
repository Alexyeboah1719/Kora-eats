<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rider | KORA EATS</title>
  <meta name="theme-color" content="#0F2E22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
  <link href="/css/dash.css" rel="stylesheet">
</head>
<body>
  <div id="dash-root"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex"><div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/dash.js"></script>
  <script src="/js/rider-tracking.js"></script>
  <script src="/js/rider-dash.js"></script>
  <script src="/js/dash-notifs.js"></script>
  <script src="/js/wallet-ui.js"></script>
  <script src="/js/ai-widget-role.js"></script>
  <script>
    // Handle top-up callback parameters
    const urlParams = new URLSearchParams(window.location.search);
    const topupStatus = urlParams.get('topup');
    if (topupStatus === 'success') {
      UI.toast('Top-up successful! Your balance has been updated.');
      // Clean URL
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (topupStatus === 'failed') {
      UI.toast('Top-up failed. Please try again.', 'error');
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (topupStatus === 'already_processed') {
      UI.toast('Top-up already processed.');
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
  <script src="/js/dash-init.js" data-area="rider" data-title="Rider" data-roles='["RIDER"]'></script>
</body>
</html>
