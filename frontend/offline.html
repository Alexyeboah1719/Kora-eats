<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline | KORA EATS</title>
  <meta name="theme-color" content="#0F2E22">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f4; color: #0f2e22; font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    .card { max-width: 380px; } .ic { font-size: 3rem; } h1 { margin: .5rem 0; font-size: 1.5rem; }
    p { color: #4b5f55; } button, a.b { display: inline-block; margin: .3rem; background: #0f2e22; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.2rem; font-weight: 600; text-decoration: none; cursor: pointer; font-size: 1rem; }
    a.b { background: #fff; color: #0f2e22; border: 1px solid #0f2e22; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ic" aria-hidden="true">&#128246;</div>
    <h1>You're offline</h1>
    <p>We can't reach KORA EATS right now. Menus you've already viewed are still available. Orders and payments need a connection.</p>
    <button id="retry" type="button">Try again</button>
    <a class="b" href="/">Open saved home page</a>
  </div>
  <script src="/js/offline.js"></script>
</body>
</html>
