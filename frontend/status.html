<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System status | KORA EATS</title>
  <meta name="description" content="Order food from vendors near you in Ghana.">
  <meta name="theme-color" content="#0F2E22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <span class="brand"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i> KORA EATS</span>
      <span class="text-muted-ink small">Accra &middot; Kumasi &middot; Takoradi</span>
    </div>
  </header>

  <main id="main" class="container py-5">
    <section class="hero">
      <h1>Hot food from vendors near you.</h1>
      <p class="lead">Chop bar favourites, jollof, waakye and more, delivered to your door.</p>
      <p class="text-muted-ink">We're setting things up. Ordering opens soon.</p>
    </section>

    <section class="status-card" aria-labelledby="status-title" aria-live="polite">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 id="status-title" class="h5 mb-0">System status</h2>
        <button id="recheck" class="btn btn-sm btn-outline-dark" type="button">
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Check again
        </button>
      </div>
      <ul class="list-unstyled mb-0" id="status-list">
        <li class="status-row"><span>API</span><span class="skeleton"></span></li>
        <li class="status-row"><span>Database</span><span class="skeleton"></span></li>
        <li class="status-row"><span>Environment</span><span class="skeleton"></span></li>
      </ul>
    </section>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
