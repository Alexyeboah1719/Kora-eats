# Render blueprint: one Docker web service serves the API AND the static frontend.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
# Fill in the `sync: false` values when prompted (secrets and your Neon DATABASE_URL).
services:
  - type: web
    name: kora-eats
    runtime: docker
    plan: free             # free tier: sleeps when idle (~50s cold start) and has NO persistent disk — uploads are lost on redeploy. Use `starter` + disk for production.
    region: frankfurt      # closest Render region to Ghana
    branch: main
    healthCheckPath: /api/health
    # No `disk:` on the free plan — /data/uploads is ephemeral. Add it back with plan: starter for production.
    envVars:
      - key: ENVIRONMENT
        value: development   # TESTING ONLY: allows SKIP_EMAIL_VERIFICATION until Resend/domain is ready. Switch back to production for launch.
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: KORA EATS
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: SECRET_KEY
        sync: false
      # Neon: postgresql+psycopg://USER:PASSWORD@HOST/DBNAME?sslmode=require  (sslmode=require is mandatory)
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      # TESTING: accounts are created email-verified instantly, no OTP (no Resend domain yet).
      # MUST be removed and ENVIRONMENT set back to production before real launch.
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      # Your actual Render URL
      - key: FRONTEND_BASE_URL
        value: https://kora-eats-bl3q.onrender.com
      - key: CORS_ORIGINS
        value: https://kora-eats-bl3q.onrender.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: CSP_MODE
        value: report-only
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY     # sk_test_... first, then sk_live_...
        sync: false
      - key: ENABLED_PAYMENT_METHODS
        value: MOBILE_MONEY
      - key: GOOGLE_CLIENT_ID     # public by design; empty disables Google sign-in
        value: 424429116910-n09qrj5gvc048aqnl2kb64gha22q45na.apps.googleusercontent.com
      # Turnstile disabled for the testing phase (empty keys = no-op). Re-add site+secret keys to re-enable.
      - key: TURNSTILE_SITE_KEY
        value: ""
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM               # e.g. "KORA EATS <orders@yourdomain.com>" after verifying the domain in Resend
        sync: false
      # Web Push (notifications when the app is closed). Public key is safe to commit;
      # paste the private key in the dashboard. Generate a pair with: python -m scripts.generate_vapid
      - key: VAPID_PUBLIC_KEY
        value: BMgqGXzdOFmZJ411dF02XUP8uSE3ig-WFAJ9NIiScdad2m88htlSe9xCAxc8SqoFJL5BXhPiCR9KAON1fGwAjCc
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@koraeats.app
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: WEB_CONCURRENCY   # free instances have 512MB RAM — one worker is safer
        value: "1"
