name: Keep the site awake
# Render's free tier sleeps after ~15 min without traffic, and the cold start takes ~50s —
# which looks like "the website loads slowly" to the first visitor. Pinging the health
# endpoint every 10 minutes keeps the instance warm. Harmless if a run is skipped or late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://kora-eats-bl3q.onrender.com/api/health
